parameters:
    # Define the anchor with RabbitMQ options
#    rabbitmq_dsn: &rabbitmq_dsn
#        dsn: '%env(MESSENGER_TRANSPORT_DSN_RABBITMQ)%'
#
#    rabbitmq_retry: &rabbitmq_retry
#        max_retries: 3
#        multiplier: 2

framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        # failure_transport: failed

        failure_transport: failed

        transports:
#            async:
#                <<: *rabbitmq_dsn
#                options:
#                    exchange:
#                        name: async
#                        type: fanout
#                    queues:
#                        async:
#                            binding_keys: [async]
#                retry_strategy: *rabbitmq_retry
#
            # Separate queue from meili on purpose: a full Elasticsearch reindex must not
            # delay Meilisearch updates, the two want different retry behaviour (ES answers
            # 429 when its write queue saturates), and each can be consumed and stopped by
            # its own worker.
            elastic:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: elastic
                retry_strategy:
                    max_retries: 3
                    multiplier: 2

            meili:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
#            Symfony\Component\Console\Messenger\RunCommandMessage: async
            App\Message\FetchYoutubeChannelMessage: sync
            App\Message\LoadSongsMessage: sync

            Survos\MeiliBundle\Message\BatchIndexEntitiesMessage: meili
            Survos\ElasticBundle\Message\ReindexDocuments: elastic
            Survos\ElasticBundle\Message\RemoveDocuments: elastic
            # Route your messages to the transports
            # 'App\Message\YourMessage': async

when@test:
    framework:
        messenger:
            transports:
                # Use in-memory transport for testing
                async: 'in-memory://'
                meili: 'in-memory://'
