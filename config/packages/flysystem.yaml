# Read the documentation at https://github.com/thephpleague/flysystem-bundle/blob/master/docs/1-getting-started.md
#
# Important: keep dev/test usable without requiring S3 env vars.

flysystem:
    storages:
        # Default (dev-friendly): store archives locally.
        archive.storage:
            adapter: 'local'
            options:
                directory: '%kernel.project_dir%/public/archive'
        # Used for thumbnail creation, etc.
        local.storage:
            adapter: 'local'
            options:
                directory: '%env(APP_DATA_DIR)%/mediary'

when@prod:
    services:
        Aws\S3\S3Client:
            arguments:
                - version: '2006-03-01'
                  region: 'us-east-1'
                  endpoint: '%env(S3_ENDPOINT)%'
                  use_path_style_endpoint: true
                  credentials:
                      key: '%env(AWS_S3_ACCESS_ID)%'
                      secret: '%env(AWS_S3_ACCESS_SECRET)%'

    flysystem:
        storages:
            archive.storage:
                adapter: 'aws'
                # visibility: public # Make the uploaded file publicly accessible in S3
                options:
                    client: 'Aws\S3\S3Client' # The service ID of the Aws\S3\S3Client instance
                    bucket: '%env(AWS_S3_BUCKET_NAME)%'
                    streamReads: true
                    prefix: '%env(S3_STORAGE_PREFIX)%'

when@test:
    flysystem:
        storages:
            archive.storage:
                adapter: 'memory'
            # also on production, for thumbnail creation
            local.storage:
                adapter: 'memory'

when@dev:
    flysystem:
        storages:
            local.storage:
                adapter: 'local'
                options:
                    directory: '%kernel.project_dir%/public'
