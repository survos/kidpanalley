add_header X-Frame-Options "SAMEORIGIN";
add_header X-Content-Type-Options "nosniff";

# Allow large file uploads
client_max_body_size 100M;

index index.php;

charset utf-8;

location ^~ /assets/ {
    expires max;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location / {
    try_files $uri /index.php$is_args$args;
}

# /favicon.ico: browsers request it unprompted on the first page view of every
# session. Without a terminating location it falls through to index.php and
# Symfony answers with a NotFoundHttpException -- never a real error, and the
# noisiest line in the production log. try_files ends the request in nginx:
# public/favicon.ico when it exists, 204 otherwise, PHP never involved.
location = /favicon.ico { access_log off; log_not_found off; try_files $uri =204; }
location = /robots.txt  { access_log off; log_not_found off; }

error_page 404 /index.php;

location ~ /\.(?!well-known) {
    deny all;
}
